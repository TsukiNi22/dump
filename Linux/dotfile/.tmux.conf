set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# General
set -g history-limit 50000                      # Scrollback
set -g escape-time 10
set -g mouse on                                 # Wheel scroll + selection limited to the pane under the mouse
set -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on
set -g copy-command 'wl-copy'                   # Used by copy-pipe without argument
set -as terminal-features ',*:RGB'              # True colors

# Modes, like neovim, GLOBAL: every pane of the session (grouped sessions included) is in the same mode
#   EDIT (the shell) -> Esc -> CONTROL (scroll, move, g/G...) -> v -> SELECT (the pane in focus)
#   Esc: EDIT -> CONTROL, SELECT -> CONTROL, CONTROL -> EDIT      a / i: back to EDIT      Ctrl+b: prefix in every mode
# In a full screen program (nvim, less...) Esc is sent to it, use Shift+PageUp or the prefix + [ to enter CONTROL
# (~/.config/tmux/mode.sh puts all the panes in CONTROL or back in EDIT)
bind -n Escape if -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys Escape' 'run-shell "~/.config/tmux/mode.sh enter"'
bind -n S-PageUp run-shell "~/.config/tmux/mode.sh enter" \; send-keys -X page-up   # Scroll back with the keyboard
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'run-shell "~/.config/tmux/mode.sh enter" ; send -M'
bind -T copy-mode-vi Escape if -F '#{selection_present}' 'send -X clear-selection ; refresh-client -S' 'run-shell "~/.config/tmux/mode.sh leave"'
bind -T copy-mode-vi i run-shell "~/.config/tmux/mode.sh leave"
bind -T copy-mode-vi a run-shell "~/.config/tmux/mode.sh leave"
bind -T copy-mode-vi v send -X begin-selection \; refresh-client -S
bind -T copy-mode-vi V send -X select-line \; refresh-client -S
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe \; run-shell "~/.config/tmux/mode.sh leave"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe \; run-shell "~/.config/tmux/mode.sh leave"
bind -T copy-mode-vi g send -X history-top      # g / G: top / bottom of the history
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi S-PageUp send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down
bind -T copy-mode-vi C-b switch-client -T prefix # The prefix works in the CONTROL and SELECT modes too
bind -T copy-mode-vi Left select-pane -L \; refresh-client -S    # Arrows change the pane, all the panes are in CONTROL
bind -T copy-mode-vi Right select-pane -R \; refresh-client -S
bind -T copy-mode-vi Up select-pane -U \; refresh-client -S
bind -T copy-mode-vi Down select-pane -D \; refresh-client -S
set-hook -g pane-mode-changed 'refresh-client -S'

# Status bar (rose-pine like the neovim theme)
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1f1d2e,fg=#908caa'
set -g status-left-length 60
set -g status-right-length 100
set -g status-left '#{?pane_in_mode,#{?selection_present,#[bg=#f6c177#,fg=#191724#,bold] SELECT ,#[bg=#9ccfd8#,fg=#191724#,bold] CONTROL },#[bg=#c4a7e7#,fg=#191724#,bold] EDIT }#[bg=#26233a,fg=#e0def4] #S #[default] '
set -g status-right '#[fg=#9ccfd8]#(cd "#{pane_current_path}" && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#6e6a86]| #[fg=#f6c177]#(cut -d" " -f1 /proc/loadavg) #[fg=#6e6a86]| #[fg=#e0def4]%H:%M '
set -g window-status-format '#[fg=#6e6a86] #I:#W '
set -g window-status-current-format '#[bg=#26233a,fg=#ebbcba,bold] #I:#W#{?window_zoomed_flag, Z,} '
set -g window-status-separator ''

# Panes: visible borders, and a line closing the bottom of every pane (above the status bar)
set -g pane-border-lines heavy
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#c4a7e7#,bold],#[fg=#6e6a86]} #{pane_index}: #{pane_current_command} #[default]'
set -g pane-border-style 'fg=#6e6a86'
set -g pane-active-border-style 'fg=#c4a7e7'

# Messages, selection
set -g message-style 'bg=#26233a,fg=#e0def4'
set -g mode-style 'bg=#c4a7e7,fg=#191724'
